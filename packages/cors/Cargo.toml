[package]
name = "cors"
version = "0.1.0"
description = "CORS Anywhere"
authors = ["Jorge Galat <jrgglt@gmail.com>"]
edition = "2024"
repository = "https://github.com/jgalat/jg.ar"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0.151"
worker = "0.8.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
